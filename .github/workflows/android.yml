name: Android Stage Build

on:
  push:
    branches: [ "stage" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Create apk directory
        run: mkdir -p apk

      - name: Find and move generated APK to apk folder
        run: |
          find . -type f -name "*.apk" -exec cp {} apk/ \;
          echo "APK files moved to apk/ folder:"
          ls -l apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: stage-apk
          path: apk/
