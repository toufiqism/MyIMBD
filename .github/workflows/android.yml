name: Android Stage Build

on:
  push:
    branches: [ "stage" ]  # Trigger only when pushing to the stage branch

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build release APK
        run: ./gradlew assembleRelease  # or assembleDebug

      - name: Create apk directory
        run: mkdir -p apk

      - name: Move generated APK to apk folder
        run: |
          cp app/build/outputs/apk/release/app-release.apk apk/app-release.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: stage-apk
          path: apk/app-release.apk
